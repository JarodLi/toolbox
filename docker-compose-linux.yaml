version: '3.8'                                                             
services:                                                                  
  my:                                                                      
    image: my:20240725                                                     
    container_name: my1                                                    
    hostname: lijian
    privileged: true
    ports:
      - "8000:22"
      - "8888:8888"
      - "9999:9999"
      - "8080:8080"
      - "7443:7443"
      - "8090:8090"
      - "2181:2181"
      - "80:80"
      - "123:123"
      - "20051:20051"
    volumes:
      - /usr1:/usr1
      - /share:/share
      - /var/run/docker.sock:/docker.sock
    restart: always
    deploy:
      resources:
        limits:
          cpus: '8' # 限制 CPU 使用不超过 0.5 个核
          memory: 10240 # 限制内存使用不超过 1024 兆字节
        reservations:
          cpus: '8' # 容器启动时请求的 CPU，建议设置为 limits 的一半或更少
          memory: 10240  # 容器启动时请求的内存
